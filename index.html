<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Happy Birthday ✨</title>

  <!-- Google Fonts: Arabic (Cairo & Tajawal) + English Script & Display (Dancing Script & Poppins) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Dancing+Script:wght@600;700&family=Poppins:wght@400;600;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-matrix: #050508;
      --bg-night-top: #070812;
      --bg-night-bottom: #0d1021;
      --neon-pink: #ff2a85;
      --neon-pink-soft: #ff77b7;
      --neon-pink-glow: rgba(255, 42, 133, 0.75);
      --card-bg: rgba(255, 255, 255, 0.96);
      --text-dark: #251d29;
      --text-muted: #6c5b73;
      --accent-rose: #ff3b8d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-matrix);
      font-family: 'Cairo', 'Poppins', sans-serif;
      color: #fff;
      user-select: none;
    }

    /* ==================== CANVASES ==================== */
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }

    #matrixCanvas {
      z-index: 1;
      opacity: 1;
      transition: opacity 1.4s ease-in-out;
    }

    #starfieldCanvas {
      z-index: 2;
      opacity: 0;
      background: linear-gradient(180deg, var(--bg-night-top) 0%, var(--bg-night-bottom) 100%);
      transition: opacity 1.6s ease-in-out;
    }

    body.night-mode #matrixCanvas {
      opacity: 0;
    }

    body.night-mode #starfieldCanvas {
      opacity: 1;
    }

    /* ==================== STAGE & SCENES ==================== */
    #app {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .scene {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 18px 86px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(18px) scale(0.97);
      transition: opacity 0.85s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.85s cubic-bezier(0.22, 1, 0.36, 1),
                  visibility 0.85s;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .scene::-webkit-scrollbar {
      display: none;
    }

    .scene.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    /* ==================== SCENE 1: MATRIX INTRO ==================== */
    #scene1 {
      cursor: pointer;
    }

    .matrix-overlay {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 220px;
      padding: 20px;
    }

    .neon-word {
      font-family: 'Poppins', 'Cairo', sans-serif;
      font-weight: 800;
      font-size: clamp(2.6rem, 9vw, 5.5rem);
      letter-spacing: 0.08em;
      color: #ffd6e8;
      text-shadow:
        0 0 10px var(--neon-pink),
        0 0 25px var(--neon-pink),
        0 0 50px var(--neon-pink-glow),
        0 0 90px rgba(255, 42, 133, 0.45);
      opacity: 0;
      transform: scale(0.75);
      transition: opacity 0.45s ease, transform 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      line-height: 1.25;
      max-width: 90vw;
      word-wrap: break-word;
    }

    .neon-word.is-arabic {
      letter-spacing: 0;
      font-family: 'Cairo', sans-serif;
    }

    .neon-word.show {
      opacity: 1;
      transform: scale(1);
    }

    .neon-word.countdown {
      font-size: clamp(4.5rem, 15vw, 8.5rem);
    }

    .neon-heart-wrap {
      display: none;
      align-items: center;
      justify-content: center;
      animation: heartbeat 1.1s infinite ease-in-out;
      filter: drop-shadow(0 0 18px var(--neon-pink)) drop-shadow(0 0 38px var(--neon-pink-glow));
    }

    .neon-heart-wrap.show {
      display: flex;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.16); }
      45% { transform: scale(0.98); }
      65% { transform: scale(1.12); }
    }

    .tap-hint {
      position: fixed;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.82rem;
      color: rgba(255, 182, 217, 0.7);
      letter-spacing: 0.04em;
      animation: pulseOpacity 2s infinite ease-in-out;
      pointer-events: none;
      white-space: nowrap;
    }

    @keyframes pulseOpacity {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.9; }
    }

    /* ==================== SCENE 2: STARRY TRANSITION ==================== */
    .star-wish-box {
      text-align: center;
      max-width: 540px;
      padding: 24px;
    }

    .star-wish-title {
      font-family: 'Dancing Script', 'Cairo', cursive, sans-serif;
      font-size: clamp(2.1rem, 6vw, 3.4rem);
      color: #ffe3f0;
      text-shadow: 0 0 22px rgba(255, 105, 180, 0.65);
      margin-bottom: 12px;
    }

    .star-wish-sub {
      font-size: clamp(1rem, 3vw, 1.15rem);
      color: rgba(235, 238, 255, 0.85);
      line-height: 1.7;
    }

    /* ==================== SCENE 3: ILLUSTRATION & LOVE LETTER ==================== */
    .scene3-layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 580px;
      gap: 10px;
    }

    .illustration-stage {
      width: 100%;
      max-width: 390px;
      margin-bottom: -14px;
      z-index: 2;
      filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.45));
    }

    .floating-heart-svg {
      animation: floatHeartUp 3.2s ease-in-out infinite;
      transform-origin: center;
    }

    .floating-heart-svg.delay-1 { animation-delay: 0.8s; }
    .floating-heart-svg.delay-2 { animation-delay: 1.6s; }

    @keyframes floatHeartUp {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-7px) scale(1.08); }
    }

    .bunny-sway {
      animation: gentleSway 3.5s ease-in-out infinite;
      transform-origin: 200px 210px;
    }

    @keyframes gentleSway {
      0%, 100% { transform: rotate(-1.5deg); }
      50% { transform: rotate(1.5deg); }
    }

    .letter-card {
      background: var(--card-bg);
      color: var(--text-dark);
      border-radius: 18px;
      box-shadow:
        0 20px 55px rgba(0, 0, 0, 0.6),
        0 0 35px rgba(255, 77, 148, 0.25);
      width: 100%;
      padding: 24px 24px 26px;
      text-align: center;
      position: relative;
      z-index: 3;
    }

    .hands-heart-badge {
      width: 78px;
      height: 56px;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .love-letter-text {
      font-family: 'Tajawal', 'Cairo', 'Poppins', sans-serif;
      font-size: clamp(1.02rem, 3.2vw, 1.15rem);
      line-height: 1.85;
      color: #2f2436;
      white-space: pre-line;
      max-height: 34vh;
      overflow-y: auto;
      padding: 0 6px;
    }

    /* ==================== FLOATING CONTROL BAR ==================== */
    .control-bar {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 17, 32, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 119, 183, 0.28);
      padding: 7px 12px;
      border-radius: 999px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .ctrl-btn {
      background: transparent;
      border: none;
      color: #ffe3f1;
      font-family: 'Cairo', 'Poppins', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.25s ease, color 0.25s ease, transform 0.15s ease;
      white-space: nowrap;
    }

    .ctrl-btn:hover {
      background: rgba(255, 42, 133, 0.24);
      color: #fff;
    }

    .ctrl-btn:active {
      transform: scale(0.95);
    }

    .ctrl-btn.primary {
      background: linear-gradient(135deg, #ff2a85, #ff62a5);
      color: #fff;
      box-shadow: 0 4px 14px rgba(255, 42, 133, 0.45);
    }

    .ctrl-btn.primary:hover {
      background: linear-gradient(135deg, #ff3d90, #ff77b3);
    }

    .scene-dots {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0 6px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.28);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .dot.active {
      width: 18px;
      border-radius: 999px;
      background: var(--neon-pink);
      box-shadow: 0 0 8px var(--neon-pink);
    }

    @media (max-width: 480px) {
      .ctrl-btn span.label-hide-xs {
        display: none;
      }
      .ctrl-btn {
        padding: 7px 10px;
      }
    }
  </style>
</head>
<body>

  <!-- Background Canvases -->
  <canvas id="matrixCanvas"></canvas>
  <canvas id="starfieldCanvas"></canvas>

  <!-- Main Interactive Stage -->
  <main id="app">

    <!-- ==================== SCENE 1: PINK MATRIX & COUNTDOWN ==================== -->

  <!-- Background Song File (40s to 90s) -->

  <script>
    /* ============================================================================
       🎀 CUSTOMIZATION SECTION (عدّل البيانات هنا بسهولة)
       ============================================================================ */
    const CONFIG = {
      // 1. اسم صاحبة عيد الميلاد (يظهر في شاشة الماتريكس الوردية)
      recipientName: "Howida",

      // 2. رسالة عيد الميلاد في المشهد الأخير
      loveLetterMessage: `بصي هو الكلام عشوائي بس هقولك الي دايماً بحس بيه
انتي راحه بالي وعيني وروحي وكل الحلو في حياتي انا مببقاش مبسوط غير معاكي ومش عايز غير اني اتبسط معاكي وافرحك زي ما بتفرحيني
انا مبرتاحش غير معاكي انتي كل الناس وكل الدنيا ومحدش غيرك هيملى حياتي ولا عيني
انا والله بحبك جداً فوق الوصف وكل الي يهمني اشوفك مبسوطه ومطمنه
مفيش مكان اقدر ارتاح فيه غير معاكي ومبأڤورش والله
انتي وجودك مهم عندي يا حبيبي
انتي حنينه وجميله وقلبك ابيض وروحك حلوه ودمك خفيف كلك على بعضك حته قشطه طريه حاجه كدا فخمه الفخامه
انا دايماً مبسوط بيكي وانك معايا ويلي تنشكي مش عايز اجيب تاليا غير منك
انا مهما قلت مش هكفيكي حقك بس ربنا يخليكي ليا
دا اول عيد ميلاد ليكي معايا وان شاء الله مش اخر واحد ويارب كل سنه نفضل سوا لاخر العمر ان شاء الله
هتفضلي منوره حياتي وهفضل احبك دايماً
كل سنه وانتي طيبه وكل سنه وانتي حلاوه وجمال واحلى بنت وست البنات ياعم الطري كل سنه وانتي معايا يا حبيبي ونفضل سوا دايماً انا بحبك جداً جداً جداً والله العظيم ومبحبش حد قدك يا عيوني ويارب اشوفك دايماً مبسوطه ومطمنه ياروحي وزي ما قولتلك انا بحبك وقلبي بيحبك وهيفضل يحبك يا كل الناس ♥️♥️♥️♥️♥️♥️♥️`,

      // 3. وقت بداية ونهاية المقطع الصوتي (بالثواني)
      audioStartSec: 40,
      audioEndSec: 90,

      // 4. سرعة الانتقال التلقائي (بالملي ثانية)
      autoAdvanceIntro: true,
      starryTransitionDuration: 3200
    };

    /* ============================================================================
       HELPER: DETECT ARABIC TEXT FOR AUTOMATIC RTL / FONT STYLING
       ============================================================================ */
    function isArabic(text) {
      return /[\u0600-\u06FF]/.test(text);
    }

    function applyLanguageDirection(el, text) {
      if (isArabic(text)) {
        el.setAttribute("dir", "rtl");
        el.classList.add("is-arabic");
      } else {
        el.setAttribute("dir", "ltr");
        el.classList.remove("is-arabic");
      }
    }

    const letterEl = document.getElementById("loveLetterMessage");
    letterEl.textContent = CONFIG.loveLetterMessage;
    applyLanguageDirection(letterEl, CONFIG.loveLetterMessage);

    /* ============================================================================
       CANVAS 1: PINK MATRIX DIGITAL RAIN (HIGH FPS)
       ============================================================================ */
    const matrixCanvas = document.getElementById("matrixCanvas");
    const mCtx = matrixCanvas.getContext("2d");
    let mWidth, mHeight, mColumns, mDrops;
    const matrixChars = "HAPPYBIRTHDAY♥✨01LOVE★❤";
    const fontSize = 16;

    function initMatrix() {
      mWidth = matrixCanvas.width = window.innerWidth;
      mHeight = matrixCanvas.height = window.innerHeight;
      mColumns = Math.floor(mWidth / fontSize);
      mDrops = Array.from({ length: mColumns }, () => Math.random() * -40);
    }

    function drawMatrix() {
      if (!document.body.classList.contains("night-mode")) {
        mCtx.fillStyle = "rgba(5, 5, 8, 0.14)";
        mCtx.fillRect(0, 0, mWidth, mHeight);

        mCtx.font = `bold ${fontSize}px monospace`;

        for (let i = 0; i < mDrops.length; i++) {
          const text = matrixChars.charAt(Math.floor(Math.random() * matrixChars.length));
          const x = i * fontSize;
          const y = mDrops[i] * fontSize;

          const isBrightTip = Math.random() > 0.85;
          mCtx.fillStyle = isBrightTip ? "#ffd6e8" : "#ff2a85";
          mCtx.shadowColor = "#ff2a85";
          mCtx.shadowBlur = isBrightTip ? 10 : 4;

          mCtx.fillText(text, x, y);
          mCtx.shadowBlur = 0;

          if (y > mHeight && Math.random() > 0.975) {
            mDrops[i] = 0;
          }
          mDrops[i] += 0.65;
        }
      }
      requestAnimationFrame(drawMatrix);
    }

    /* ============================================================================
       CANVAS 2: TWINKLING & DRIFTING STARRY NIGHT SKY
       ============================================================================ */
    const starCanvas = document.getElementById("starfieldCanvas");
    const sCtx = starCanvas.getContext("2d");
    let sWidth, sHeight, stars = [];

    function initStars() {
      sWidth = starCanvas.width = window.innerWidth;
      sHeight = starCanvas.height = window.innerHeight;
      const count = Math.min(180, Math.floor((sWidth * sHeight) / 6500));
      stars = Array.from({ length: count }, () => ({
        x: Math.random() * sWidth,
        y: Math.random() * sHeight,
        radius: Math.random() * 1.8 + 0.4,
        alpha: Math.random(),
        twinkleSpeed: (Math.random() * 0.02 + 0.006) * (Math.random() < 0.5 ? 1 : -1),
        driftY: -(Math.random() * 0.18 + 0.04),
        hue: Math.random() > 0.8 ? "#ffb8dc" : "#ffffff"
      }));
    }

    function drawStars() {
      if (document.body.classList.contains("night-mode")) {
        sCtx.clearRect(0, 0, sWidth, sHeight);

        for (let star of stars) {
          star.alpha += star.twinkleSpeed;
          if (star.alpha <= 0.15 || star.alpha >= 1) {
            star.twinkleSpeed *= -1;
          }
          star.y += star.driftY;
          if (star.y < -5) {
            star.y = sHeight + 5;
            star.x = Math.random() * sWidth;
          }

          sCtx.beginPath();
          sCtx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
          sCtx.fillStyle = star.hue;
          sCtx.globalAlpha = Math.max(0.1, Math.min(1, star.alpha));
          sCtx.shadowColor = star.hue;
          sCtx.shadowBlur = star.radius * 4;
          sCtx.fill();
        }
        sCtx.globalAlpha = 1;
        sCtx.shadowBlur = 0;
      }
      requestAnimationFrame(drawStars);
    }

    window.addEventListener("resize", () => {
      initMatrix();
      initStars();
    });

    initMatrix();
    initStars();
    drawMatrix();
    drawStars();

    /* ============================================================================
       SCENE & SEQUENCE CONTROLLER (3 SCENES: INTRO -> STARRY SKY -> LOVE LETTER)
       ============================================================================ */
    const scenes = [
      document.getElementById("scene1"),
      document.getElementById("scene2"),
      document.getElementById("scene3")
    ];
    const dots = document.querySelectorAll(".dot");
    const seqWordEl = document.getElementById("sequenceWord");
    const seqHeartEl = document.getElementById("sequenceHeart");

    let currentScene = 0;
    let sequenceStep = 0;
    let sequenceTimer = null;
    let scene2Timer = null;

    const introSteps = [
      { type: "text", value: "TO", duration: 1100 },
      { type: "text", value: "BIRTHDAY", duration: 1250 },
      { type: "text", value: CONFIG.recipientName, duration: 1650 },
      { type: "heart", duration: 1450 },
      { type: "countdown", value: "3", duration: 950 },
      { type: "countdown", value: "2", duration: 950 },
      { type: "countdown", value: "1", duration: 950 }
    ];

    function renderIntroStep(index) {
      clearTimeout(sequenceTimer);

      if (index >= introSteps.length) {
        goToScene(1);
        return;
      }

      sequenceStep = index;
      const step = introSteps[index];

      seqWordEl.classList.remove("show", "countdown", "is-arabic");
      seqHeartEl.classList.remove("show");

      requestAnimationFrame(() => {
        if (step.type === "heart") {
          seqWordEl.style.display = "none";
          seqHeartEl.classList.add("show");
        } else {
          seqWordEl.style.display = "block";
          seqWordEl.textContent = step.value;
          applyLanguageDirection(seqWordEl, step.value);
          if (step.type === "countdown") {
            seqWordEl.classList.add("countdown");
          }
          void seqWordEl.offsetWidth;
          seqWordEl.classList.add("show");
        }
      });

      if (CONFIG.autoAdvanceIntro) {
        sequenceTimer = setTimeout(() => {
          renderIntroStep(index + 1);
        }, step.duration);
      }
    }

    function goToScene(index) {
      clearTimeout(sequenceTimer);
      clearTimeout(scene2Timer);

      currentScene = Math.max(0, Math.min(scenes.length - 1, index));

      if (currentScene === 0) {
        document.body.classList.remove("night-mode");
      } else {
        document.body.classList.add("night-mode");
      }

      scenes.forEach((sc, idx) => {
        sc.classList.toggle("active", idx === currentScene);
      });

      dots.forEach((dot, idx) => {
        dot.classList.toggle("active", idx === currentScene);
      });

      if (currentScene === 0) {
        renderIntroStep(0);
      } else if (currentScene === 1) {
        scene2Timer = setTimeout(() => {
          if (currentScene === 1) goToScene(2);
        }, CONFIG.starryTransitionDuration);
      }
    }

    // Tap/Click on Scene 1 advances sequence immediately & starts song clip
    document.getElementById("scene1").addEventListener("click", () => {
      startMusicOnce();
      renderIntroStep(sequenceStep + 1);
    });

    // Control Bar Events
    document.getElementById("replayBtn").addEventListener("click", () => {
      goToScene(0);
    });

    document.getElementById("prevBtn").addEventListener("click", () => {
      if (currentScene === 0 && sequenceStep > 0) {
        renderIntroStep(sequenceStep - 1);
      } else {
        goToScene(currentScene - 1);
      }
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      startMusicOnce();
      if (currentScene === 0) {
        renderIntroStep(sequenceStep + 1);
      } else {
        goToScene((currentScene + 1) % scenes.length);
      }
    });

    dots.forEach(dot => {
      dot.addEventListener("click", () => {
        startMusicOnce();
        const target = Number(dot.dataset.scene);
        goToScene(target);
      });
    });

    /* ============================================================================
       AUDIO CLIP CONTROLLER: 01.Kalam_El_Donya.mp3 (FROM 40s TO 90s)
       ============================================================================ */
    const bgAudio = document.getElementById("bgAudio");
    let isMusicPlaying = false;
    let hasTriedAutoMusic = false;

    function seekToClipStart() {
      if (!bgAudio) return;
      if (bgAudio.currentTime < CONFIG.audioStartSec || bgAudio.currentTime >= CONFIG.audioEndSec) {
        bgAudio.currentTime = CONFIG.audioStartSec;
      }
    }

    if (bgAudio) {
      bgAudio.addEventListener("loadedmetadata", seekToClipStart);

      bgAudio.addEventListener("timeupdate", () => {
        if (bgAudio.currentTime >= CONFIG.audioEndSec) {
          bgAudio.currentTime = CONFIG.audioStartSec;
          if (isMusicPlaying) {
            bgAudio.play().catch(() => {});
          }
        }
      });
    }

    function toggleMusic(forceState) {
      const musicIcon = document.getElementById("musicIcon");
      if (!bgAudio) return;

      isMusicPlaying = typeof forceState === "boolean" ? forceState : !isMusicPlaying;

      if (isMusicPlaying) {
        seekToClipStart();
        bgAudio.play().then(() => {
          musicIcon.textContent = "🎵";
        }).catch(() => {
          isMusicPlaying = false;
          musicIcon.textContent = "🔇";
        });
      } else {
        bgAudio.pause();
        musicIcon.textContent = "🔇";
      }
    }

    function startMusicOnce() {
      if (!hasTriedAutoMusic) {
        hasTriedAutoMusic = true;
        toggleMusic(true);
      }
    }

    document.getElementById("musicBtn").addEventListener("click", () => {
      hasTriedAutoMusic = true;
      toggleMusic();
    });

    // Start Scene 1 on load
    goToScene(0);
  </script>
</body>
</html>
